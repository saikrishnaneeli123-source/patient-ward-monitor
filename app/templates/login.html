{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login">
  <h1>Ward Monitor</h1>
  <p class="muted">Sign in to view the ward board.</p>
  {% if error %}<p class="banner warn login-error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="card">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username <input type="text" name="username" autocomplete="username" autofocus required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted small-print">
    Accounts are created by an administrator. Repeated failed attempts lock an account
    for five minutes.
  </p>
</div>
{% endblock %}
